worker_processes  1;

events {
  worker_connections  4096;
}

http {
  access_log off;

  # ------------------------------------------------------------------ upstream
  #
  # THE IMPORTANT LIMITATION: open-source nginx has PASSIVE health checks only.
  # Active health checks (`health_check`) are an nginx Plus feature.
  #
  # So nginx discovers a dead backend by SENDING REAL USER REQUESTS TO IT and
  # watching them fail. Someone always eats the first `max_fails` errors.
  # That is the trade-off you measure in experiment A3.
  #
  #   max_fails=3     3 failures within fail_timeout marks the server down
  #   fail_timeout=10s  ...and it stays down for 10s before being retried
  #
  upstream backend {
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;

    keepalive 64;   # reuse upstream connections (Phase 1 note 02)
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;

      # ---------------------------------------------------------- timeouts
      # Without proxy_read_timeout, a HANGING backend holds this connection
      # for 60s (the default). Try setting this to 60s and re-running
      # experiment A4 to see how much worse it gets.
      proxy_connect_timeout 1s;
      proxy_send_timeout    5s;
      proxy_read_timeout    2s;

      # ------------------------------------------------------ retry policy
      # `error timeout` is nginx's DEFAULT. It is why `docker kill` on a
      # backend produces far fewer errors than you would expect (experiment
      # A2) -- nginx transparently retries the next upstream.
      #
      # http_500 is NOT in the default. Add it and experiment A3's errors
      # disappear too -- at the cost of doubling load on the survivors.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
    }

    # nginx's own liveness, not the backends'
    location /nginx-health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
